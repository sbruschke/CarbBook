name: CarbBook

options:
  bundleIdPrefix: dev.dxshdw
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO

packages:
  CarbBookCore:
    path: CarbBookCore
  CarbBookKit:
    path: CarbBookKit

targets:
  CarbBook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarbBook
    dependencies:
      - package: CarbBookCore
      - package: CarbBookKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dxshdw.carbbook
        PRODUCT_NAME: CarbBook
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        # Temporary icon: the web PWA's icon.svg rendered at 1024 px (Assets.xcassets/AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CarbBook
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        # HealthKit needs both halves: the entitlement (granted at signing time; the file sits beside
        # project.yml so it is never copied into the bundle as a resource) and this usage
        # string. iOS terminates the app on an authorization request that has no usage string.
        CODE_SIGN_ENTITLEMENTS: CarbBook.entitlements
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "CarbBook adds the carbs you log, and the insulin you record taking, to Apple Health."
        INFOPLIST_KEY_NSCameraUsageDescription: "CarbBook uses the camera to scan food barcodes and to take photos of your foods and meals."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CarbBook uses photos you choose to illustrate your foods and meals."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
